<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="340" viewBox="0 0 1130 340" role="img"
     aria-label="The test rig: press() and screen() hold the master fd, delivered() and emit() hold the slave fd, and every arrow crosses the line discipline under test.">
  <title>The test rig: both ends of one pty, with the line discipline between them.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- master: the screen-and-keyboard end -->
    <rect x="20" y="40" width="310" height="280" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
    <text x="175" y="68" text-anchor="middle" font-size="14" fill="#0f172a"><tspan font-weight="600">master fd</tspan> — the screen-and-keyboard end</text>

    <rect x="45" y="152" width="260" height="56" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="175" y="173" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">press(bytes)</text>
    <text x="175" y="193" text-anchor="middle" font-size="13" fill="#0f172a">you typed</text>

    <rect x="45" y="222" width="260" height="76" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="175" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">screen()</text>
    <text x="175" y="272" text-anchor="middle" font-size="13" fill="#0f172a">the screen showed</text>

    <!-- the line discipline, spanning all three lanes -->
    <rect x="472" y="80" width="176" height="232" rx="8" fill="#fbbf24" stroke="#78350f" stroke-width="2.5"/>
    <text x="560" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">line discipline</text>
    <text x="560" y="128" text-anchor="middle" font-size="13" fill="#0f172a">the flags under test</text>

    <!-- inside the box: input passes through, forks into echo; output passes through -->
    <g fill="none" stroke="#78350f" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.6">
      <path d="M478 180 H642"/>
      <path d="M642 278 H478"/>
      <path d="M478 186 C566 186 566 235 478 235"/>
    </g>

    <!-- slave: the program end -->
    <rect x="810" y="40" width="300" height="280" rx="10" fill="#f0fdf4" stroke="#166534" stroke-width="1.5"/>
    <text x="960" y="68" text-anchor="middle" font-size="14" fill="#0f172a"><tspan font-weight="600">slave fd</tspan> — the program end</text>

    <rect x="835" y="152" width="250" height="56" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
    <text x="960" y="173" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">delivered()</text>
    <text x="960" y="193" text-anchor="middle" font-size="13" fill="#0f172a">the program read</text>

    <rect x="835" y="250" width="250" height="56" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
    <text x="960" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">emit(bytes)</text>
    <text x="960" y="291" text-anchor="middle" font-size="13" fill="#0f172a">the program wrote</text>

    <!-- the three lanes -->
    <g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M305 180 H469"/>
      <path d="M651 180 H831"/>
      <path d="M835 278 H651"/>
      <path d="M472 278 H309"/>
      <path d="M472 235 H309"/>
    </g>

    <!-- lane labels -->
    <g font-size="12">
      <rect x="661" y="160" width="160" height="40" rx="4" fill="#334155"/>
      <text x="741" y="177" text-anchor="middle" fill="#f1f5f9"><tspan font-weight="600">input</tspan> — ICRNL, ICANON,</text>
      <text x="741" y="192" text-anchor="middle" fill="#f1f5f9">ISIG, IXON, VMIN/VTIME</text>

      <rect x="320" y="215" width="140" height="40" rx="4" fill="#334155"/>
      <text x="390" y="232" text-anchor="middle" fill="#f1f5f9"><tspan font-weight="600">echo</tspan> — ECHO,</text>
      <text x="390" y="247" text-anchor="middle" fill="#f1f5f9">ECHOE, ECHOCTL</text>

      <rect x="315" y="265" width="150" height="26" rx="4" fill="#334155"/>
      <text x="390" y="282" text-anchor="middle" fill="#f1f5f9"><tspan font-weight="600">output</tspan> — OPOST, ONLCR</text>
    </g>
  </g>
</svg>
